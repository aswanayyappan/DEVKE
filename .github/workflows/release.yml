name: Publish DevKE to Open VSX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build, Test, and Publish VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo
        run: npm run build

      - name: Run verification tests
        run: |
          node --experimental-strip-types tests/vertical-slice.test.ts
          node --experimental-strip-types tests/multi-ecosystem.test.ts
          node --experimental-strip-types tests/ai-grounding.test.ts

      - name: Package VSIX
        working-directory: apps/vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Publish to Open VSX via OIDC
        run: npx --yes ovsx publish apps/vscode-extension/*.vsix
